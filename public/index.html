<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Tube</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Top Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon"></div>
            <span>G-Tube</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn">🔍</button>
            <button class="icon-btn"></button>
        </div>
    </header>

    <!-- Category Menu -->
    <nav class="category-nav">
        <button class="cat-btn active">All</button>
        <button class="cat-btn">Health</button>
        <button class="cat-btn">Tech</button>
        <button class="cat-btn">Business</button>
        <button class="cat-btn">Relationship</button>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
        <div class="loading">Loading videos...</div>
    </main>

    <!-- Video Player Modal (Hidden by default) -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="playerContainer"></div>
            <div id="videoDetails"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showPage('home')">🏠<br>Home</button>
        <button class="nav-item" onclick="showPage('gchat')">💬<br>G-Chat</button>
        <button class="nav-item" onclick="showPage('admin')">🔒<br>Admin</button>
        <button class="nav-item" onclick="showPage('rewards')">🎁<br>Rewards</button>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
